<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Відправлення — PostService</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">PostService</a>
    <button class="menu-btn" id="menuBtn" type="button" aria-label="Меню" aria-expanded="false">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="5" width="18" height="2" fill="#1b2330"/>
        <rect x="3" y="11" width="18" height="2" fill="#1b2330"/>
        <rect x="3" y="17" width="18" height="2" fill="#1b2330"/>
      </svg>
    </button>
    <nav class="nav" id="nav">
      <a href="index.html">Головна</a>
      <a href="posting-list.html" class="active">Відправлення</a>
      <a href="about.html">Про програму</a>
    </nav>
  </header>

  <main>
    <div class="page-head">
      <h1>Список поштових відправлень</h1>
      <a class="btn btn-primary" href="posting-edit.html">Створити</a>
    </div>

    <div class="toolbar" id="toolbar">
      <button class="btn" id="btnEdit" type="button" disabled>Редагувати</button>
      <button class="btn" id="btnDetails" type="button" disabled>Деталі</button>
      <button class="btn btn-danger" id="btnDelete" type="button" disabled>Видалити</button>
      <div class="spacer"></div>
      <span class="selected-info" id="info"></span>
      <button class="btn" id="btnRefresh" type="button">Оновити</button>
    </div>

    <div class="table" role="table" aria-label="Список поштових відправлень">
      <div class="thead" role="row">
        <div>№</div><div>Відправник</div><div>Отримувач</div><div>Вміст</div>
        <div>Тип доставки</div><div>Вага, кг</div><div>Вартість, грн</div><div>Створено</div>
      </div>
      <div id="rows"></div>
    </div>

    <div class="cards" id="cards"></div>
  </main>

  <script type="module" src="scripts/list-page.js"></script>
</body>
</html>
