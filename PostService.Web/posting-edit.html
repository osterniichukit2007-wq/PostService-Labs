<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Відправлення — PostService</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">PostService</a>
    <button class="menu-btn" id="menuBtn" type="button" aria-label="Меню" aria-expanded="false">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="5" width="18" height="2" fill="#1b2330"/>
        <rect x="3" y="11" width="18" height="2" fill="#1b2330"/>
        <rect x="3" y="17" width="18" height="2" fill="#1b2330"/>
      </svg>
    </button>
    <nav class="nav" id="nav">
      <a href="index.html">Головна</a>
      <a href="posting-list.html" class="active">Відправлення</a>
      <a href="about.html">Про програму</a>
    </nav>
  </header>

  <main>
    <h1 id="title">Нове відправлення</h1>

    <div class="alert" id="alert" role="alert"><span id="alertText"></span></div>

    <form id="form" class="form-box" novalidate>
      <div class="form-row">
        <label for="from">Відправник *</label>
        <input id="from" autocomplete="off" aria-describedby="from-msg">
        <div class="msg" id="from-msg"></div>
      </div>

      <div class="form-row">
        <label for="to">Отримувач *</label>
        <input id="to" autocomplete="off" aria-describedby="to-msg">
        <div class="msg" id="to-msg"></div>
      </div>

      <div class="form-row">
        <label for="content">Вміст *</label>
        <input id="content" autocomplete="off" aria-describedby="content-msg">
        <div class="msg" id="content-msg"></div>
      </div>

      <div class="form-row">
        <label for="deliveryType">Тип доставки *</label>
        <select id="deliveryType">
          <option value="Department">Відділення</option>
          <option value="Courier">Кур'єр</option>
        </select>
        <div></div>
      </div>

      <div class="form-row">
        <label for="weight">Вага, кг *</label>
        <input id="weight" inputmode="decimal" autocomplete="off" aria-describedby="weight-msg">
        <div class="msg" id="weight-msg"></div>
      </div>

      <div class="form-row">
        <label for="width">Ширина, см *</label>
        <input id="width" inputmode="decimal" autocomplete="off" aria-describedby="width-msg">
        <div class="msg" id="width-msg"></div>
      </div>

      <div class="form-row">
        <label for="height">Висота, см *</label>
        <input id="height" inputmode="decimal" autocomplete="off" aria-describedby="height-msg">
        <div class="msg" id="height-msg"></div>
      </div>

      <div class="form-row">
        <label for="depth">Глибина, см *</label>
        <input id="depth" inputmode="decimal" autocomplete="off" aria-describedby="depth-msg">
        <div class="msg" id="depth-msg"></div>
      </div>

      <div class="form-row">
        <label for="value">Оголошена цінність, грн</label>
        <input id="value" inputmode="decimal" autocomplete="off" aria-describedby="value-msg">
        <div class="msg" id="value-msg"></div>
      </div>

      <div class="form-row">
        <label for="price">Вартість, грн</label>
        <input id="price" readonly placeholder="Розраховується автоматично">
        <div></div>
      </div>

      <div class="req-note">* — обов'язкові поля</div>

      <div class="form-actions">
        <button class="btn btn-primary" id="btnSave" type="submit">Зберегти</button>
        <a class="btn" id="btnCancel" href="posting-list.html">Скасувати</a>
      </div>
    </form>
  </main>

  <script type="module" src="scripts/edit-page.js"></script>
</body>
</html>
